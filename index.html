<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Удостоверение личности</title>
  <style>
    /* --- ОСНОВНЫЕ СБРОСЫ И ОТНОСИТЕЛЬНЫЕ ЕДИНИЦЫ --- */
    :root {
      --bg-color: #F2F2F7;
      --card-bg: #FFFFFF;
      --primary-color: #0056C6;
      --text-main: #1C1C1E;
      --text-muted: #8E8E93;
      --border-color: #E5E5EA;
      --radius-large: 1.1rem;
      --radius-medium: 0.6rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    /* Главный контейнер во весь экран iOS */
    .app-container {
      width: 100%;
      max-width: 28rem; /* Ограничение ширины для планшетов/ПК, на айфоне 100% */
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 1rem) + 0.5rem) 4% calc(env(safe-area-inset-bottom, 1rem) + 0.75rem) 4%;
    }

    /* --- ШАПКА --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 2.75rem;
      margin-bottom: 0.5rem;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      cursor: pointer;
    }

    .title {
      font-size: clamp(1rem, 4.2vw, 1.15rem);
      font-weight: 600;
      text-align: center;
      flex: 1;
    }

    .header-placeholder {
      width: 2.25rem;
    }

    /* --- ПЕРЕКЛЮЧАТЕЛЬ ТАБОВ --- */
    .segmented-control {
      background-color: #E3E3E8;
      border-radius: var(--radius-medium);
      padding: 0.15rem;
      display: flex;
      margin-bottom: 1rem;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.5rem 0;
      font-size: 0.9rem;
      font-weight: 500;
      color: #3C3C43;
      border-radius: calc(var(--radius-medium) - 0.1rem);
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
    }

    .tab-btn.active {
      background-color: #FFFFFF;
      color: #000000;
      font-weight: 600;
      box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.08);
    }

    /* --- ОСНОВНАЯ ОБЛАСТЬ КОНТЕНТА --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .tab-panel {
      display: none;
      width: 100%;
    }

    .tab-panel.active {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* --- ВКЛАДКА 1: ДОКУМЕНТ --- */
    .document-card {
      background: var(--card-bg);
      border-radius: var(--radius-large);
      padding: 4%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 0.1rem 0.5rem rgba(0, 0, 0, 0.03);
    }

    .doc-side {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .doc-side-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .doc-preview {
      width: 100%;
      aspect-ratio: 85.6 / 54; /* Стандартная пропорция ID-карты */
      background-color: #F8F9FA;
      border: 1px dashed #C7C7CC;
      border-radius: var(--radius-medium);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .doc-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .doc-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .file-input {
      display: none;
    }

    /* --- ВКЛАДКА 2: РЕКВИЗИТЫ --- */
    .details-list {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      padding: 0.2rem 0.2rem 1rem 0.2rem;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .detail-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .detail-value {
      font-size: 1rem5;
      font-weight: 500;
      color: var(--text-main);
    }

    .copy-btn {
      background: none;
      border: none;
      padding: 0.5rem;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .copy-btn:active {
      opacity: 0.4;
    }

    /* --- НИЖНИЙ БЛОК КНОПОК --- */
    .footer {
      margin-top: auto;
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .btn {
      width: 100%;
      height: 3.1rem;
      border-radius: var(--radius-medium);
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn:active {
      opacity: 0.75;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #FFFFFF;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary-color);
      border: 1px solid #C6C6C8;
    }

    /* Уведомление о копировании */
    .toast {
      position: fixed;
      bottom: 5rem;
      left: 50%;
      transform: translateX(-50%) translateY(1rem);
      background: rgba(0, 0, 0, 0.85);
      color: #FFFFFF;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="header">
      <button class="back-btn" onclick="alert('Назад')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="title">Удостоверение личности</h1>
      <div class="header-placeholder"></div>
    </header>

    <div class="segmented-control">
      <button class="tab-btn active" id="btn-doc" onclick="switchTab('doc')">Документ</button>
      <button class="tab-btn" id="btn-details" onclick="switchTab('details')">Реквизиты</button>
    </div>

    <main class="main-content">
      
      <div class="tab-panel active" id="panel-doc">
        <div class="document-card">
          
          <div class="doc-side">
            <span class="doc-side-label">Лицевая сторона</span>
            <div class="doc-preview" onclick="triggerFileInput('file-front')">
              <div class="doc-placeholder" id="ph-front">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <span>Нажмите, чтобы загрузить фото</span>
              </div>
              <img id="img-front" alt="Лицевая сторона">
              <input type="file" id="file-front" class="file-input" accept="image/*" onchange="loadDocumentImage(event, 'img-front', 'ph-front')">
            </div>
          </div>

          <div class="doc-side">
            <span class="doc-side-label">Оборотная сторона</span>
            <div class="doc-preview" onclick="triggerFileInput('file-back')">
              <div class="doc-placeholder" id="ph-back">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <span>Нажмите, чтобы загрузить фото</span>
              </div>
              <img id="img-back" alt="Оборотная сторона">
              <input type="file" id="file-back" class="file-input" accept="image/*" onchange="loadDocumentImage(event, 'img-back', 'ph-back')">
            </div>
          </div>

        </div>
      </div>

      <div class="tab-panel" id="panel-details">
        <div class="details-list">
          
          <div class="detail-item">
            <div class="detail-info">
              <span class="detail-label">ФИО</span>
              <span class="detail-value" id="val-fio">Енилеев Максим Ильдарович</span>
            </div>
            <button class="copy-btn" onclick="copyText('val-fio')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>

          <div class="detail-item">
            <div class="detail-info">
              <span class="detail-label">ИИН</span>
              <span class="detail-value" id="val-iin">080123554342</span>
            </div>
            <button class="copy-btn" onclick="copyText('val-iin')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>

          <div class="detail-item">
            <div class="detail-info">
              <span class="detail-label">Дата рождения</span>
              <span class="detail-value" id="val-dob">23.01.2008</span>
            </div>
            <button class="copy-btn" onclick="copyText('val-dob')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>

          <div class="detail-item">
            <div class="detail-info">
              <span class="detail-label">Номер документа</span>
              <span class="detail-value" id="val-docnum">055661569</span>
            </div>
            <button class="copy-btn" onclick="copyText('val-docnum')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>

          <div class="detail-item">
            <div class="detail-info">
              <span class="detail-label">Дата выдачи</span>
              <span class="detail-value" id="val-issued">14.02.2024</span>
            </div>
            <button class="copy-btn" onclick="copyText('val-issued')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>

          <div class="detail-item">
            <div class="detail-info">
              <span class="detail-label">Срок действия</span>
              <span class="detail-value" id="val-expiry">13.02.2034</span>
            </div>
            <button class="copy-btn" onclick="copyText('val-expiry')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>

        </div>
      </div>

    </main>

    <footer class="footer">
      <div id="doc-actions" style="display: flex; flex-direction: column; gap: 0.6rem;">
        <button class="btn btn-primary" onclick="alert('Предъявление документа')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Предъявить документ
        </button>
        <button class="btn btn-secondary" onclick="alert('Отправка документа')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
          Отправить документ
        </button>
      </div>

      <div id="details-actions" style="display: none; width: 100%;">
        <button class="btn btn-secondary" onclick="alert('Отправка реквизитов')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
          Отправить реквизиты
        </button>
      </div>
    </footer>

  </div>

  <div class="toast" id="toast">Скопировано</div>

  <script>
    // Переключение вкладок без сдвигов верстки
    function switchTab(type) {
      const isDoc = type === 'doc';
      
      document.getElementById('panel-doc').classList.toggle('active', isDoc);
      document.getElementById('panel-details').classList.toggle('active', !isDoc);

      document.getElementById('btn-doc').classList.toggle('active', isDoc);
      document.getElementById('btn-details').classList.toggle('active', !isDoc);

      document.getElementById('doc-actions').style.display = isDoc ? 'flex' : 'none';
      document.getElementById('details-actions').style.display = isDoc ? 'none' : 'flex';
    }

    // Загрузка своего файла фото
    function triggerFileInput(id) {
      document.getElementById(id).click();
    }

    function loadDocumentImage(event, imgId, phId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById(imgId);
          img.src = e.target.result;
          img.style.display = 'block';
          document.getElementById(phId).style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    }

    // Копирование реквизитов
    function copyText(id) {
      const text = document.getElementById(id).innerText;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
      }
      showToast();
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }
  </script>
</body>
</html>
