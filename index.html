<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Удостоверение">
  <meta name="mobile-web-app-capable" content="yes">
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%230056C6'><rect width='512' height='512' rx='120'/><path d='M160 160h192v192H160z' fill='%23fff'/></svg>">
  <link rel="manifest" href='data:application/manifest+json,{"name":"Удостоверение личности","short_name":"Документы","start_url":".","display":"standalone","background_color":"#F2F2F7","theme_color":"#F2F2F7"}'>

  <title>Удостоверение личности</title>
  
  <style>
    :root {
      --bg: #F2F2F7;
      --card-bg: #FFFFFF;
      --primary: #0056C6;
      --text-main: #1C1C1E;
      --text-muted: #8E8E93;
      --border: #E5E5EA;
      --ease-ios: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--text-main);
      overflow: hidden; /* Фиксирует экраны от лишней прокрутки */
    }

    body {
      display: flex;
      justify-content: center;
    }

    /* Главный контейнер */
    .app-container {
      width: 100%;
      max-width: 28rem;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 1rem) + 0.5rem) 4% calc(env(safe-area-inset-bottom, 1rem) + 0.75rem) 4%;
      overflow: hidden;
    }

    /* Шапка */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 2.75rem;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-main);
      padding: 0.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .title {
      font-size: clamp(1rem, 4vw, 1.15rem);
      font-weight: 600;
      text-align: center;
      flex: 1;
    }

    .header-space {
      width: 2.2rem;
    }

    /* Переключатель Табов со скользящей белой плашкой */
    .segmented-control {
      position: relative;
      background-color: #E3E3E8;
      border-radius: 0.6rem;
      padding: 0.15rem;
      display: flex;
      margin-bottom: 1rem;
      flex-shrink: 0;
    }

    .slider-pill {
      position: absolute;
      top: 0.15rem;
      left: 0.15rem;
      width: calc(50% - 0.15rem);
      height: calc(100% - 0.3rem);
      background: #FFFFFF;
      border-radius: 0.5rem;
      box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.1);
      transition: transform 0.35s var(--ease-ios);
      z-index: 1;
    }

    .tab-btn {
      flex: 1;
      position: relative;
      z-index: 2;
      border: none;
      background: transparent;
      padding: 0.5rem 0;
      font-size: 0.9rem;
      font-weight: 500;
      color: #3C3C43;
      cursor: pointer;
      transition: color 0.25s, font-weight 0.25s;
    }

    .tab-btn.active {
      color: #000000;
      font-weight: 600;
    }

    /* ОСНОВНАЯ ЗОНА СЛАЙДЕРА КОНТЕНТА */
    .content-viewport {
      width: 100%;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .content-track {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.35s var(--ease-ios);
      will-change: transform;
    }

    .panel {
      width: 50%;
      height: 100%;
      flex-shrink: 0;
      overflow-y: auto;
      box-sizing: border-box;
      padding-bottom: 0.5rem;
    }

    /* Вкладка 1: Карточки Документов */
    .document-card {
      background: var(--card-bg);
      border-radius: 1.1rem;
      padding: 4%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 0.1rem 0.5rem rgba(0, 0, 0, 0.03);
    }

    .doc-side {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .doc-side-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .doc-preview {
      width: 100%;
      aspect-ratio: 85.6 / 54;
      background-color: #F8F9FA;
      border: 1px dashed #C7C7CC;
      border-radius: 0.6rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .doc-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .doc-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .file-input {
      display: none;
    }

    /* Вкладка 2: Реквизиты */
    .details-list {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      padding: 0.2rem 0.2rem 1rem 0.2rem;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .detail-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .detail-value {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .copy-btn {
      background: none;
      border: none;
      padding: 0.5rem;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .copy-btn:active {
      opacity: 0.4;
    }

    /* ЗОНА СЛАЙДЕРА НИЖНИХ КНОПОК */
    .footer-viewport {
      width: 100%;
      overflow: hidden;
      flex-shrink: 0;
      padding-top: 0.5rem;
    }

    .footer-track {
      display: flex;
      width: 200%;
      transition: transform 0.35s var(--ease-ios);
      will-change: transform;
    }

    .footer-panel {
      width: 50%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      box-sizing: border-box;
      padding-right: 0.2rem;
    }

    .btn {
      width: 100%;
      height: 3.1rem;
      border-radius: 0.6rem;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn:active {
      opacity: 0.75;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFFFFF;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 1px solid #C6C6C8;
    }

    /* Toast скопированного текста */
    .toast {
      position: fixed;
      bottom: 5rem;
      left: 50%;
      transform: translateX(-50%) translateY(1rem);
      background: rgba(0, 0, 0, 0.85);
      color: #FFFFFF;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="header">
      <button class="back-btn" onclick="alert('Назад')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="title">Удостоверение личности</h1>
      <div class="header-space"></div>
    </header>

    <div class="segmented-control">
      <div class="slider-pill" id="sliderPill"></div>
      <button class="tab-btn active" id="btn-doc" onclick="switchTab(0)">Документ</button>
      <button class="tab-btn" id="btn-details" onclick="switchTab(1)">Реквизиты</button>
    </div>

    <div class="content-viewport">
      <div class="content-track" id="contentTrack">
        
        <div class="panel">
          <div class="document-card">
            
            <div class="doc-side">
              <span class="doc-side-label">Лицевая сторона</span>
              <div class="doc-preview" onclick="triggerFile('file-front')">
                <div class="doc-placeholder" id="ph-front">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                  <span>Нажмите для выбора фото</span>
                </div>
                <img id="img-front" alt="Лицевая сторона">
                <input type="file" id="file-front" class="file-input" accept="image/*" onchange="uploadImage(event, 'img-front', 'ph-front')">
              </div>
            </div>

            <div class="doc-side">
              <span class="doc-side-label">Оборотная сторона</span>
              <div class="doc-preview" onclick="triggerFile('file-back')">
                <div class="doc-placeholder" id="ph-back">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                  <span>Нажмите для выбора фото</span>
                </div>
                <img id="img-back" alt="Оборотная сторона">
                <input type="file" id="file-back" class="file-input" accept="image/*" onchange="uploadImage(event, 'img-back', 'ph-back')">
              </div>
            </div>

          </div>
        </div>

        <div class="panel">
          <div class="details-list">
            
            <div class="detail-item">
              <div class="detail-info">
                <span class="detail-label">ФИО</span>
                <span class="detail-value" id="val-fio">Енилеев Максим Ильдарович</span>
              </div>
              <button class="copy-btn" onclick="copyValue('val-fio')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </button>
            </div>

            <div class="detail-item">
              <div class="detail-info">
                <span class="detail-label">ИИН</span>
                <span class="detail-value" id="val-iin">080123554342</span>
              </div>
              <button class="copy-btn" onclick="copyValue('val-iin')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </button>
            </div>

            <div class="detail-item">
              <div class="detail-info">
                <span class="detail-label">Дата рождения</span>
                <span class="detail-value" id="val-dob">23.01.2008</span>
              </div>
              <button class="copy-btn" onclick="copyValue('val-dob')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </button>
            </div>

            <div class="detail-item">
              <div class="detail-info">
                <span class="detail-label">Номер документа</span>
                <span class="detail-value" id="val-docnum">055661569</span>
              </div>
              <button class="copy-btn" onclick="copyValue('val-docnum')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </button>
            </div>

            <div class="detail-item">
              <div class="detail-info">
                <span class="detail-label">Дата выдачи</span>
                <span class="detail-value" id="val-issued">14.02.2024</span>
              </div>
              <button class="copy-btn" onclick="copyValue('val-issued')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </button>
            </div>

            <div class="detail-item">
              <div class="detail-info">
                <span class="detail-label">Срок действия</span>
                <span class="detail-value" id="val-expiry">13.02.2034</span>
              </div>
              <button class="copy-btn" onclick="copyValue('val-expiry')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </button>
            </div>

          </div>
        </div>

      </div>
    </div>

    <div class="footer-viewport">
      <div class="footer-track" id="footerTrack">
        
        <div class="footer-panel">
          <button class="btn btn-primary" onclick="alert('Предъявить документ')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Предъявить документ
          </button>
          <button class="btn btn-secondary" onclick="alert('Отправить документ')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
            Отправить документ
          </button>
        </div>

        <div class="footer-panel">
          <button class="btn btn-secondary" onclick="alert('Отправить реквизиты')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
            Отправить реквизиты
          </button>
        </div>

      </div>
    </div>

  </div>

  <div class="toast" id="toast">Скопировано</div>

  <script>
    // Переключение вкладок со сдвигом 
    function switchTab(index) {
      // 1. Двигаем плашку табов
      document.getElementById('sliderPill').style.transform = `translateX(${index * 100}%)`;

      // 2. Двигаем основной контент
      document.getElementById('contentTrack').style.transform = `translateX(-${index * 50}%)`;

      // 3. Двигаем нижние кнопки
      document.getElementById('footerTrack').style.transform = `translateX(-${index * 50}%)`;

      // 4. Меняем стили активной кнопки
      document.getElementById('btn-doc').classList.toggle('active', index === 0);
      document.getElementById('btn-details').classList.toggle('active', index === 1);
    }

    // Загрузка фото в карточки
    function triggerFile(id) {
      document.getElementById(id).click();
    }

    function uploadImage(e, imgId, phId) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = document.getElementById(imgId);
          img.src = evt.target.result;
          img.style.display = 'block';
          document.getElementById(phId).style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    }

    // Копирование
    function copyValue(id) {
      const text = document.getElementById(id).innerText;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
      }
      showToast();
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }
  </script>
</body>
</html>
